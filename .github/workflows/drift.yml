name: Drift detection

# Nightly check: does real AWS still match the code? Catches console clicks and
# manual fixes that never made it back into Terraform.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"

jobs:
  drift:
    name: Drift check
    runs-on: [self-hosted, innovatech]
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Init
        run: terraform init -input=false

      - name: Check for drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Environment torn down on purpose: nothing to compare against.
          if [ -z "$(terraform state list)" ]; then
            echo "State is empty (environment not deployed). Skipping."
            exit 0
          fi

          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color > plan.txt
          code=$?
          set -e
          cat plan.txt

          if [ "$code" -eq 0 ]; then
            echo "No drift." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 1 ]; then exit 1; fi

          # Drift found: open an issue, unless one is already open
          summary_line=$(grep -E '^Plan:' plan.txt || echo "Changes detected")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/issues"
          open=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$api?state=open&labels=drift" | jq length)
          if [ "$open" -eq 0 ]; then
            jq -n --arg body "Nightly drift check found differences between AWS and the code: **$summary_line**. Details: $run_url" \
              '{title: "Infrastructure drift detected", labels: ["drift"], body: $body}' \
              | curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -d @- "$api" > /dev/null
          fi
          echo "Drift detected: $summary_line ($run_url)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
